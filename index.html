<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Roboter Steuern</title>
    <link rel="icon" href="roboFischertechnik.png" />
    <!--css files-->
    <link rel="stylesheet" href="style.css" />
    <!--js files-->
    <script type="module" src="./js/main.js"></script>
  </head>
  <body>
    <main>
      <h1>Steuere deinen eigenen Roboter!</h1>

      <div id="controlCard" class="card">
        <div id="connectOverlay" class="overlay card invisible">
          <div id="connectMenu">
            <h2 id="connectStatus">🔴 Nicht Verbunden</h2>
            <button id="connectBtn">Nach Geräten in der Nähe Suchen</button>
            <!-- for later use when working with a local server to connect to the controller: -->
            <!-- <div id="deviceList" class="overlay">
              <h3>Geräte in der Nähe:</h3>
              <ul id="nearbyDevices">
              </ul>
            </div> -->
          </div>
        </div>

        <div id="controlStopOverlay" class="overlay card invisible">
          <div id="buttonWrapper">
            <button id="play">Fortsetzen</button>
            <button id="controlSettings">Einstellungen</button>
            <button id="changeDevice">Gerät wechseln</button>
            <button id="disconnectDevice">Beenden</button>
          </div>
        </div>

        <div id="controlOverlay">
          <div id="joystickMove">
            <canvas id="joystickMoveCanvas"> </canvas>
          </div>

          <div id="joystickTurn">
            <canvas id="joystickTurnCanvas"> </canvas>
          </div>
        </div>

        <div id="camVideo">
          <video src="./Moby Dick - Ishmael im Gasthaus.mp4" muted autoplay loop></video>
        </div>
      </div>
    </main>
  </body>
</html>
