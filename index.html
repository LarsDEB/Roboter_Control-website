<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Roboter Steuern</title>
    <link rel="icon" href="roboFischertechnik.png" />
    <!--css files-->
    <link rel="stylesheet" href="style.css" />
    <!--js files-->
    <script type="module" src="./js/main.js"></script>
  </head>
  <body>
    <main>
      <h1>Steuere deinen eigenen Roboter!</h1>

      <div id="controlCard" class="card">
        <div id="connectOverlay" class="overlay card">
          <div id="connectMenu">
            <h2 id="connectStatus" data-ui="status">❌ Nicht Verbunden!</h2>
            <form id="connectForm" data-ui="form" action="">
              <label for="ipInput">Gib die IP-Adresse des Controllers ein:</label>
              <input
                id="ipInput"
                data-ui="ipInput"
                name="controllerIp"
                type="text"
                maxlength="15"
                placeholder="z.B.: 192168451"
              />
              <button id="connectBtn" data-ui="connectBtn" type="submit">
                Controller Verbinden
              </button>
            </form>
          </div>
        </div>

        <div id="controlStopOverlay" class="overlay card invisible">
          <div id="buttonWrapper">
            <button id="play" data-ui="play">Fortsetzen</button>
            <button id="controlSettings" data-ui="settings">Einstellungen (Platzhalter)</button>
            <button id="connection" data-ui="connection">Controller Trennen</button>
          </div>
        </div>

        <div id="controlOverlay" class="invisible">
          <div id="joystickMove">
            <canvas id="joystickMoveCanvas" data-ui="move"> </canvas>
          </div>

          <div id="joystickTurn">
            <canvas id="joystickTurnCanvas" data-ui="turn"> </canvas>
          </div>
        </div>

        <div id="camVideo">
          <iframe data-ui="iframe" src="" frameborder="0"></iframe>
        </div>
      </div>
    </main>
  </body>
</html>
